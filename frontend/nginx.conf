events {
    worker_connections  1024;
}

http {
    upstream backend {
        server backend:8080;
    }

    server {
        listen 80;

        location /api {
            proxy_pass http://backend;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;

            try_files $uri $uri/ /index.html;
        }
    }
}