spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/callmonitoring
    username: supervisor
    password: supervisor123
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format-sql: true
  sql:
    init:
      mode: never
  profiles:
    active: docker

app:
  jwt:
    secret: ${JWT_SECRET:cimb-call-monitoring-dev-secret-key-please-change-me-0123456789}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  rate-limit:
    enabled: true
    trust-xff: true
    rules:
      - path: /api/auth/login
        limit: 5
        window-seconds: 60
      - path: /api/calls
        limit: 60
        window-seconds: 60

management:
  endpoints:
    web:
      exposure:
        include: health,info
  metrics:
    export:
      prometheus:
        enabled: true

server:
  port: 8080